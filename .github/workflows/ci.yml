name: Run API Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # schedule:
  #   - cron: '0 2 * * *' # Ночной регресс (пока отключен)

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests in Docker
        run: docker compose run --rm smoke
      - name: Send Telegram notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🟡 Smoke-тесты завершены!
            Статус: ${{ job.status }}
            Репозиторий: ${{ github.repository }}
            Ветка: ${{ github.ref_name }}

  regression-tests:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all tests in Docker
        run: docker compose run --rm tests
      - name: Generate Allure report in Docker
        run: docker compose run --rm allure
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
      - name: Send Telegram notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🟢 Регресс-тесты завершены!
            Статус: ${{ job.status }}
            Репозиторий: ${{ github.repository }}
            Ветка: ${{ github.ref_name }}
